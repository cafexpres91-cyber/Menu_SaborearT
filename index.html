<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menú Digital</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,sans-serif;background:#111;color:#fff}
#app{height:100%;display:flex;flex-direction:column}header{height:54px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;background:#171717;border-bottom:1px solid #333}
.title{font-weight:bold}.counter{font-size:14px;color:#aaa}.viewer{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;position:relative}
#book{position:relative;height:min(82vh,820px);aspect-ratio:1448/2048}
.cover{
    width:50%;
    right:auto;
    transform-origin:left center;
},.spread,.single{position:absolute;inset:0;background:#fff;overflow:hidden;box-shadow:0 5px 28px #0009}
.cover{z-index:100;transform-origin:left center;backface-visibility:hidden;transition:transform .75s cubic-bezier(.2,.72,.2,1)}
.cover.open{transform:rotateY(-180deg)}
.cover img,.side img,.single img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.spread{display:flex;gap:2px;z-index:1}.side{flex:1;min-width:0;overflow:hidden;background:#fff}.side.empty{background:#fff}
.single{transform-origin:left center;transition:transform .7s cubic-bezier(.2,.72,.2,1)}.single.turn{transform:rotateY(-180deg)}
.controls{height:64px;display:flex;justify-content:center;align-items:center;gap:9px;background:#171717;border-top:1px solid #333}
button{border:0;border-radius:9px;background:#292929;color:#fff;padding:10px 16px;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}
.hint{position:absolute;bottom:7px;color:#777;font-size:11px}@media(max-width:700px){header{height:48px;padding:0 12px}.controls{height:60px}#book{height:min(80vh,760px)}}
</style></head><body><div id="app">
<header><div class="title">Menú Digital</div><div id="counter">Cargando...</div></header>
<main class="viewer"><div id="book"></div><div class="hint">Desliza o usa ← →</div></main>
<footer class="controls"><button id="prev">‹ Anterior</button><button id="fullscreen">Pantalla completa</button><button id="next">Siguiente ›</button></footer></div>
<script>
const book=document.getElementById('book'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next'),full=document.getElementById('fullscreen');
let files=[],mobile=false,pos=0,cover=null,items=[];
async function init(){try{const r=await fetch('paginas.json?v='+Date.now(),{cache:'no-store'});const d=await r.json();files=(d.paginas||[]).filter(x=>/^\d+\.png$/i.test(x)).sort((a,b)=>parseInt(a)-parseInt(b));if(!files.length)throw 0;build()}catch(e){counter.textContent='Sin páginas'}}
function im(f,n){const x=document.createElement('img');x.src='paginas/'+encodeURIComponent(f);x.alt='Página '+n;x.draggable=false;return x}
function build(){book.innerHTML='';items=[];pos=0;mobile=innerWidth<700;
cover=document.createElement('div');cover.className='cover';cover.appendChild(im(files[0],1));book.appendChild(cover);
if(mobile){for(let i=1;i<files.length;i++){let p=document.createElement('div');p.className='single';p.style.zIndex=files.length-i;p.appendChild(im(files[i],i+1));book.appendChild(p);items.push(p)}}
else{for(let i=1;i<files.length;i+=2){let s=document.createElement('div');s.className='spread';let l=document.createElement('div');l.className='side';l.appendChild(im(files[i],i+1));let r=document.createElement('div');r.className='side';if(files[i+1])r.appendChild(im(files[i+1],i+2));else r.classList.add('empty');s.append(l,r);book.appendChild(s);items.push(s)}}
update()}
function update(){if(mobile){counter.textContent=`Página ${pos+1} de ${files.length}`;prev.disabled=pos===0;next.disabled=pos>=files.length-1}
else{if(pos===0)counter.textContent=`Página 1 de ${files.length}`;else{let l=2+(pos-1)*2,r=Math.min(l+1,files.length);counter.textContent=l===r?`Página ${l} de ${files.length}`:`Páginas ${l}–${r} de ${files.length}`}prev.disabled=pos===0;next.disabled=pos>=items.length}}
function goNext(){if(mobile){if(pos>=files.length-1)return;if(pos===0)cover.classList.add('open');else items[pos-1].classList.add('turn');pos++}else{if(pos>=items.length)return;if(pos===0)cover.classList.add('open');pos++}update()}
function goPrev(){if(mobile){if(pos===0)return;if(pos===1)cover.classList.remove('open');else{pos--;items[pos-1].classList.remove('turn')}pos=Math.max(0,pos-1)}
else{if(pos===0)return;if(pos===1)cover.classList.remove('open');pos--}update()}
prev.onclick=goPrev;next.onclick=goNext;document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')goNext();if(e.key==='ArrowLeft')goPrev()});
let sx=0;book.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});book.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)(dx<0?goNext:goPrev)()},{passive:true});
full.onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};addEventListener('resize',()=>{let m=innerWidth<700;if(m!==mobile)build()});init();
</script></body></html>
