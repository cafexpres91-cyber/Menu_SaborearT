<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111">
<title>Menú Digital</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;background:#111;color:#fff}
#app{height:100%;display:flex;flex-direction:column}
header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#171717;border-bottom:1px solid #333;z-index:10}
.title{font-weight:700;letter-spacing:.4px}.counter{font-size:14px;color:#aaa}
.viewer{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:8px}
#book{position:relative;perspective:1800px}
.sheet{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform .72s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.sheet.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:#fff;overflow:hidden;border-radius:2px;box-shadow:0 5px 30px #0008}
.face.back{transform:rotateY(180deg)}
.face img{width:100%;height:100%;object-fit:contain;display:block;background:#fff;user-select:none;-webkit-user-drag:none}
.controls{height:64px;display:flex;align-items:center;justify-content:center;gap:9px;background:#171717;border-top:1px solid #333;z-index:10}
button{border:0;border-radius:9px;background:#292929;color:#fff;padding:10px 16px;font-size:14px;cursor:pointer}
button:hover{background:#3a3a3a}button:disabled{opacity:.35;cursor:not-allowed}
.empty{padding:30px;text-align:center;color:#bbb;max-width:650px}
.hint{position:absolute;bottom:10px;right:14px;color:#888;font-size:11px}
@media(max-width:700px){
 header{height:48px;padding:0 12px}.controls{height:60px}
 button{padding:10px 12px}.hint{display:none}
}
</style>
</head>
<body>
<div id="app">
<header><div class="title">Menú Digital</div><div id="counter" class="counter">Cargando...</div></header>
<main class="viewer">
  <div id="book"></div>
  <div class="hint">← → para cambiar de página</div>
</main>
<footer class="controls">
  <button id="prev">‹ Anterior</button>
  <button id="fullscreen">Pantalla completa</button>
  <button id="next">Siguiente ›</button>
</footer>
</div>
<script>
const book=document.getElementById('book'), counter=document.getElementById('counter');
const prev=document.getElementById('prev'), next=document.getElementById('next');
const full=document.getElementById('fullscreen');
let files=[], current=0, sheets=[], flipped=0;

async function loadPages(){
  try{
    const r=await fetch('paginas.json?'+Date.now());
    if(!r.ok) throw new Error();
    const data=await r.json();
    files=(data.paginas||[]).slice().sort((a,b)=>num(a)-num(b));
    if(!files.length) throw new Error();
    build();
  }catch(e){
    counter.textContent='Sin páginas';
    book.innerHTML='<div class="empty">No se encontraron páginas. Agrega imágenes como 1.png, 2.png, 3.png... en <b>paginas/</b> y actualiza <b>paginas.json</b>.</div>';
  }
}
function num(x){let m=String(x).match(/^(\d+)/);return m?Number(m[1]):999999}
function build(){
  book.innerHTML=''; sheets=[];
  // Each sheet contains two sequential pages, giving a book-like turn.
  for(let i=0;i<files.length;i+=2){
    const s=document.createElement('div'); s.className='sheet';
    const front=face(files[i], i+1, false);
    const back=face(files[i+1]||files[i], i+2, true);
    if(!files[i+1]) back.style.visibility='hidden';
    s.append(front,back); book.appendChild(s); sheets.push(s);
  }
  current=0; flipped=0; resize(); update();
}
function face(src,n,back){
  const f=document.createElement('div'); f.className='face'+(back?' back':'');
  const img=document.createElement('img'); img.src='paginas/'+encodeURIComponent(src); img.alt='Página '+n;
  f.appendChild(img); return f;
}
function update(){
  current=Math.min(files.length, flipped*2+1);
  counter.textContent=`Página ${current} de ${files.length}`;
  prev.disabled=flipped<=0; next.disabled=flipped>=sheets.length;
}
function turnNext(){
  if(flipped<sheets.length){sheets[flipped].classList.add('flipped');flipped++;update()}
}
function turnPrev(){
  if(flipped>0){flipped--;sheets[flipped].classList.remove('flipped');update()}
}
prev.onclick=turnPrev; next.onclick=turnNext;
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')turnNext();
  if(e.key==='ArrowLeft')turnPrev();
  if(e.key==='Home'){while(flipped)turnPrev()}
  if(e.key==='End'){while(flipped<sheets.length)turnNext()}
});
full.onclick=async()=>{
  try{
    if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){}
};
let sx=0;
book.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});
book.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)>45)(dx<0?turnNext:turnPrev)();
},{passive:true});
function resize(){
  const ratio=1448/2048;
  const maxH=Math.max(300,window.innerHeight-132);
  const maxW=Math.min(window.innerWidth*.88,780);
  const h=Math.min(maxH,maxW/ratio), w=h*ratio;
  book.style.width=w+'px';book.style.height=h+'px';
}
window.addEventListener('resize',resize);
loadPages();
</script>
</body>
</html>
