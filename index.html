<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>Menú Digital</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;background:#111;color:#fff}
#app{height:100%;display:flex;flex-direction:column}
header{height:54px;flex:0 0 54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#171717;border-bottom:1px solid #333}
.title{font-weight:700}.counter{font-size:14px;color:#aaa}
.viewer{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px}
#book{position:relative;width:min(94vw,calc((100vh - 150px)*1.414));height:min(calc(100vh - 150px),82vh);aspect-ratio:2/1.414;perspective:1800px}
.spread,.single{position:absolute;inset:0;background:#fff;overflow:hidden;box-shadow:0 5px 28px rgba(0,0,0,.55);visibility:hidden;opacity:0}
.spread{display:flex;gap:2px;z-index:1}.spread.active{visibility:visible;opacity:1}
.side{width:50%;height:100%;overflow:hidden;background:#fff}
.side img,.cover img,.single img{width:100%;height:100%;display:block;object-fit:contain;background:#fff;user-select:none;-webkit-user-drag:none}
.cover{position:absolute;top:0;left:50%;width:50%;height:100%;background:#fff;overflow:hidden;box-shadow:0 5px 28px rgba(0,0,0,.55);z-index:100;transform-origin:left center;backface-visibility:hidden;transition:transform .72s cubic-bezier(.2,.72,.2,1)}
.cover.open{transform:rotateY(-180deg)}
.single.active{visibility:visible;opacity:1}
.spread.turn-out,.single.turn-out{visibility:visible;opacity:1;z-index:50;transform-origin:left center;animation:turnOut .65s cubic-bezier(.2,.72,.2,1) forwards}
@keyframes turnOut{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}
.controls{height:64px;flex:0 0 64px;display:flex;align-items:center;justify-content:center;gap:9px;background:#171717;border-top:1px solid #333;padding:6px}
button{border:0;border-radius:9px;background:#292929;color:#fff;padding:10px 16px;font-size:14px;cursor:pointer}
button:hover{background:#3a3a3a}button:disabled{opacity:.35;cursor:not-allowed}
.hint{position:absolute;bottom:4px;color:#777;font-size:11px;pointer-events:none}
@media(max-width:700px){
 header{height:50px;flex-basis:50px;padding:0 16px}.viewer{padding:8px}
 #book{width:min(94vw,calc((100vh - 132px)*.707));height:min(calc(100vh - 132px),86vh);aspect-ratio:1/1.414}
 .cover{left:0;width:100%;transform-origin:center center}
 .controls{height:66px;flex-basis:66px;gap:8px}.hint{display:none}
}
@media(max-width:380px){button{padding:10px;font-size:13px}}
</style>
</head>
<body>
<div id="app">
<header><div class="title">Menú Digital</div><div id="counter" class="counter">Cargando...</div></header>
<main class="viewer"><div id="book"></div><div class="hint">Desliza o usa ← →</div></main>
<footer class="controls"><button id="prev">‹ Anterior</button><button id="fullscreen">Pantalla completa</button><button id="next">Siguiente ›</button></footer>
</div>
<script>
const book=document.getElementById('book'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next'),fullscreen=document.getElementById('fullscreen');
let files=[],mobile=false,position=0,cover=null,items=[],busy=false;

async function init(){
 try{
  const r=await fetch('paginas.json?v='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw 0;
  const d=await r.json();
  files=(d.paginas||[]).filter(x=>/^\d+\.png$/i.test(x)).sort((a,b)=>parseInt(a)-parseInt(b));
  if(!files.length)throw 0;
  build();
 }catch(e){counter.textContent='Sin páginas'}
}
function img(file,n){const x=document.createElement('img');x.src='paginas/'+encodeURIComponent(file);x.alt='Página '+n;x.draggable=false;return x}

function build(){
 book.innerHTML='';items=[];position=0;busy=false;mobile=innerWidth<=700;
 cover=document.createElement('div');cover.className='cover';cover.appendChild(img(files[0],1));book.appendChild(cover);
 if(mobile){
  for(let i=1;i<files.length;i++){const p=document.createElement('div');p.className='single';p.style.zIndex=files.length-i;p.appendChild(img(files[i],i+1));book.appendChild(p);items.push(p)}
 }else{
  for(let i=1;i<files.length;i+=2){
   const s=document.createElement('div');s.className='spread';
   const l=document.createElement('div');l.className='side';l.appendChild(img(files[i],i+1));
   const r=document.createElement('div');r.className='side';if(files[i+1])r.appendChild(img(files[i+1],i+2));
   s.append(l,r);book.appendChild(s);items.push(s);
  }
  if(items[0])items[0].classList.add('active');
 }
 update();
}
function update(){
 if(mobile){counter.textContent='Página '+(position+1)+' de '+files.length;prev.disabled=position===0;next.disabled=position>=files.length-1}
 else{
  if(position===0)counter.textContent='Página 1 de '+files.length;
  else{const l=2+(position-1)*2,r=Math.min(l+1,files.length);counter.textContent=l===r?'Página '+l+' de '+files.length:'Páginas '+l+'–'+r+' de '+files.length}
  prev.disabled=position===0;next.disabled=position>=items.length;
 }
}
function afterAnimation(el,fn){
 let done=false;
 const finish=()=>{if(done)return;done=true;el.removeEventListener('animationend',finish);fn();busy=false};
 el.addEventListener('animationend',finish);
 setTimeout(finish,750);
}
function goNext(){
 if(busy)return;
 if(mobile){
  if(position>=files.length-1)return;busy=true;
  if(position===0){cover.classList.add('open');afterAnimation(cover,()=>{position=1;update()})}
  else{const old=items[position-1],n=position;old.classList.add('turn-out');afterAnimation(old,()=>{old.classList.remove('active','turn-out');position=n+1;items[n].classList.add('active');update()})}
 }else{
  if(position>=items.length)return;busy=true;
  if(position===0){cover.classList.add('open');afterAnimation(cover,()=>{position=1;update()})}
  else{const current=items[position-1],n=position;current.classList.add('turn-out');if(items[n])items[n].classList.add('active');afterAnimation(current,()=>{current.classList.remove('active','turn-out');position=n+1;update()})}
 }
}
function goPrev(){
 if(busy)return;
 if(position===0)return;
 if(mobile){
  if(position===1){cover.classList.remove('open');position=0;update()}
  else{items[position-1].classList.remove('active');items[position-2].classList.add('active');position--;update()}
 }else{
  if(position===1){cover.classList.remove('open');position=0;update()}
  else{items[position-1].classList.remove('active');items[position-2].classList.add('active');position--;update()}
 }
}
prev.onclick=goPrev;next.onclick=goNext;
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')goNext();if(e.key==='ArrowLeft')goPrev()});
let sx=0;book.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});
book.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)(dx<0?goNext:goPrev)()},{passive:true});
fullscreen.onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};
let lastMobile=innerWidth<=700;addEventListener('resize',()=>{const m=innerWidth<=700;if(m!==lastMobile){lastMobile=m;build()}});
init();
</script>
</body>
</html>
